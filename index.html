<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Structural Vibration Simulator</title>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <span class="title">Structural Vibration Simulator</span>
      <div class="ws-switch">
        <button type="button" data-ws="dynamics" class="active">Dynamics</button>
        <button type="button" data-ws="kinematics">Kinematics</button>
      </div>
      <label class="btn">
        모델 불러오기 (JSON)
        <input id="file-input" type="file" accept=".json" hidden />
      </label>
      <button id="btn-sample" class="btn">샘플 모델</button>
      <button id="btn-fit" class="btn">전체 보기</button>
      <span class="sep"></span>
      <button id="btn-box" class="btn" title="켜면 드래그로 박스 선택 (Shift+드래그도 가능)">박스 선택</button>
      <select id="select-filter" class="btn" title="선택 필터">
        <option value="all">전체</option>
        <option value="node">절점만</option>
        <option value="bar">바만</option>
        <option value="panel">패널만</option>
      </select>
      <button id="btn-color" class="btn" title="단면별 색상 표시">단면 색상</button>
      <button id="btn-undo" class="btn" disabled>실행 취소</button>
      <button id="btn-save" class="btn">모델 저장 (JSON)</button>
    </header>
    <aside id="sidebar">
      <section>
        <h3>단위계</h3>
        <table id="units-table"></table>
      </section>
      <section>
        <h3>모델 정보</h3>
        <table id="info-table"></table>
      </section>
      <section>
        <h3>선택</h3>
        <div id="selection-info" class="selection-info"></div>
      </section>
      <section class="ws-kin">
        <h3>힌지</h3>
        <div class="preset-row">
          <button id="btn-hinge-auto" class="btn">공유 모서리 → 힌지 생성</button>
          <button id="btn-hinge-clear" class="btn">힌지 모두 삭제</button>
          <button id="btn-miura" class="btn">미우라 샘플</button>
        </div>
        <div id="hinge-info" class="selection-info"></div>
        <div id="hinge-table" class="hinge-table"></div>
      </section>
      <section class="ws-kin">
        <h3>자유도 해석</h3>
        <div class="form">
          <label>기준(고정) 패널 <select id="kin-ground"></select></label>
          <button id="btn-mobility" class="btn">자유도 해석 실행</button>
        </div>
        <div id="mob-report" class="selection-info"></div>
        <div id="mob-modes" class="preset-row"></div>
      </section>
      <section class="ws-kin">
        <h3>접힘 경로</h3>
        <div class="form">
          <label>구동 힌지 <select id="kin-driver"></select></label>
          <label>목표 접힘각 (°) <input id="kin-target" type="number" step="any" value="90" /></label>
          <label>단계 수 <input id="kin-steps" type="number" min="1" max="2000" value="60" /></label>
          <button id="btn-fold" class="btn primary">접힘 경로 계산</button>
        </div>
        <div id="kin-note" class="selection-info"></div>
        <div class="form">
          <label>단계 <input id="kin-frame" type="range" min="0" max="0" value="0" /></label>
          <div id="kin-frame-label" class="selection-info"></div>
          <label class="inline"><input id="kin-play" type="checkbox" /> 왕복 재생</label>
          <button id="btn-kin-apply" class="btn">현재 형상을 Dynamics 기준 형상으로 적용</button>
        </div>
        <div id="kin-chart" class="kin-chart"></div>
      </section>
      <section class="ws-dyn">
        <h3>단면 목록</h3>
        <div id="section-table" class="lib"></div>
      </section>
      <section class="ws-dyn">
        <h3>재료 목록</h3>
        <div id="material-table" class="lib"></div>
      </section>
      <section class="ws-dyn">
        <h3>지진동 해석 (시간이력)</h3>
        <div id="io-info" class="selection-info"></div>
        <div class="preset-row">
          <button id="btn-inputs-from-supports" class="btn" title="지점이 있는 절점을 모두 입력 절점으로 지정">지점 → 입력 절점</button>
          <button id="btn-io-clear" class="btn">입출력 지정 해제</button>
        </div>
        <div class="form">
          <label class="stack">지진동 CSV (t, ax, ay, az)
            <input id="motion-file" type="file" accept=".csv,.txt,.dat" />
          </label>
          <label>가속도 단위
            <select id="motion-unit">
              <option value="g">g</option>
              <option value="mm/s2">mm/s²</option>
              <option value="m/s2">m/s²</option>
              <option value="gal">gal (cm/s²)</option>
            </select>
          </label>
          <label>배율 <input id="motion-scale" type="number" step="any" value="1" /></label>
          <label>후행 자유진동 (s) <input id="motion-tail" type="number" min="0" step="any" value="0" /></label>
        </div>
        <div id="motion-info" class="selection-info"></div>
        <div class="form">
          <label>감쇠
            <select id="th-damp">
              <option value="modal">모드별 ξ</option>
              <option value="rayleigh">Rayleigh</option>
            </select>
          </label>
          <label>ξ (%) <input id="th-xi" type="number" step="any" value="5" /></label>
          <label>Rayleigh α (1/s) <input id="th-alpha" type="number" step="any" value="0" /></label>
          <label>Rayleigh β (s) <input id="th-beta" type="number" step="any" value="0" /></label>
          <label>최대 모드 수 <input id="th-modes" type="number" min="1" max="500" value="60" /></label>
          <label>목표 유효질량 (%) <input id="th-mass" type="number" min="10" max="100" value="90" /></label>
          <button id="btn-th" class="btn primary">지진동 해석 실행</button>
        </div>
        <div id="th-note" class="selection-info"></div>
      </section>
      <section class="ws-dyn">
        <h3>모달 해석</h3>
        <div class="form">
          <label>해석 유형
            <select id="modal-type">
              <option value="free">Free-free</option>
              <option value="constrained">지점 구속</option>
            </select>
          </label>
          <label>모드 개수
            <input id="modal-count" type="number" min="1" max="60" value="12" />
          </label>
          <button id="btn-modal" class="btn">고유치 해석 실행</button>
        </div>
        <table id="modal-table" class="results"></table>
        <div id="modal-note"></div>
        <div class="form">
          <label>변형 진폭
            <input id="amp" type="range" min="0" max="300" value="100" />
          </label>
          <label class="inline"><input id="play" type="checkbox" checked /> 애니메이션</label>
        </div>
      </section>
    </aside>
    <main id="viewport"></main>
    <footer id="statusbar"><span id="status">준비됨</span></footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
